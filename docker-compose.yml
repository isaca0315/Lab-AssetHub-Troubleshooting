name: assethub

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  garage:
    image: dxflrs/garage:v2.5.0
    container_name: assethub-storage
    # --single-node crea el layout y --default-bucket crea bucket + credenciales
    # a partir de GARAGE_DEFAULT_* (idempotente en cada arranque).
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: ${S3_ACCESS_KEY_ID}
      GARAGE_DEFAULT_SECRET_KEY: ${S3_SECRET_KEY}
      GARAGE_DEFAULT_BUCKET: ${S3_BUCKET}
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    ports:
      - "127.0.0.1:3900:3900"   # API S3
      - "127.0.0.1:3903:3903"   # API de administración (solo inspección local)
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    logging: *default-logging
    stop_grace_period: 30s
    restart: unless-stopped
    networks:
      - backend

  postgres:
    image: postgres:15-alpine
    container_name: assethub-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    shm_size: "256mb"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
    logging: *default-logging
    stop_grace_period: 30s
    restart: unless-stopped
    networks:
      - backend

  app:
    build: ./app
    container_name: assethub-api
    env_file: .env
    environment:
      # pg lee PG* automáticamente al construir el Pool
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:3000:3000"
    # Espacio de trabajo para las cargas en curso.
    tmpfs:
      - /data/uploads:size=32m,mode=1777
      - /tmp:size=16m,mode=1777
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      garage:
        condition: service_healthy
    logging: *default-logging
    stop_grace_period: 10s
    restart: unless-stopped
    networks:
      - backend

volumes:
  garage-meta:
  garage-data:
  pgdata:

networks:
  backend:
    driver: bridge
